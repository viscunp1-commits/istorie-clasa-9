<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istorie clasa a IX-a</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MODAL PENTRU MĂRIREA LOGO-ULUI ÎN MIJLOCUL ECRANULUI -->
<div id="modalLogo" class="modal-logo" onclick="inchideSauMergiAcasa(event)">
    <img id="imgModal" src="logo.jpg" alt="Logo Mare">
    <div class="modal-hint">Apasă din nou pe logo pentru a reveni la pagina principală</div>
</div>

<div class="mobile-header">
    <div class="mobile-header-left">
        <button id="btnMenuToggle" class="btn-menu-toggle" aria-label="Deschide meniul">
            ☰ Teme
        </button>
    </div>
    <div class="mobile-title" onclick="gestioneazaClickLogo(event)">
        <img src="logo.jpg" alt="Logo" class="logo-img">
        <span>Istorie clasa a IX-a</span>
    </div>
</div>

<div class="container">

    <aside id="asideMenu">
        <div class="menu-header" onclick="gestioneazaClickLogo(event)">
            <img src="logo.jpg" alt="Logo History Scope" class="logo-img">
            <span>Istorie clasa a IX-a</span>
        </div>
        <div id="listaTeme"></div>
    </aside>

    <main id="continutLectie">
    </main>

</div>

<script src="lectii.js"></script>
<script src="script.js"></script>

</body>

</html>
